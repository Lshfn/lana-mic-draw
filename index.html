<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Drawing with Lyrics</title>
  <style>
    body {
      margin: 0;
      background-color: #111;
      color: #f4f4f4;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #canvas-container {
      position: relative;
    }

    canvas {
      background-color: white;
      border: 2px solid #ccc;
    }

    #webcam {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 2px solid #fff;
    }

    .lyrics {
      position: absolute;
      color: white;
      font-size: 20px;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      opacity: 0.7;
    }

  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="canvas" width="800" height="600"></canvas>
    <video id="video" width="800" height="600" autoplay muted loop>
      <source src="https://github.com/Lshfn/lana-mic-draw/raw/main/LanaDelReyVideoGames.mp4" type="video/mp4">
    </video>
    <div id="lyrics" class="lyrics"></div>
    <video id="webcam" autoplay></video>
  </div>

  <script>
    // Set up webcam
    const webcam = document.getElementById('webcam');
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => {
        webcam.srcObject = stream;
      })
      .catch(err => console.error('Webcam error:', err));

    // Set up canvas drawing
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    canvas.addEventListener('mousedown', () => drawing = true);
    canvas.addEventListener('mouseup', () => drawing = false);
    canvas.addEventListener('mousemove', (e) => {
      if (drawing) {
        ctx.globalCompositeOperation = 'destination-out'; // Eraser effect
        ctx.beginPath();
        ctx.arc(e.offsetX, e.offsetY, 10, 0, Math.PI * 2);
        ctx.fillStyle = "white";
        ctx.fill();
        ctx.closePath();
      }
    });

    // Load VTT file for lyrics
    const vttPath = "https://github.com/Lshfn/lana-mic-draw/raw/main/videogames-lyrics.vtt";
    const lyricsElement = document.getElementById("lyrics");
    let currentCaptionIndex = 0;

    // Fetch and parse the VTT file
    fetch(vttPath)
      .then(response => response.text())
      .then(vttText => {
        const captions = parseVTT(vttText);
        displayCaptions(captions);
      })
      .catch(err => console.error('Error loading VTT:', err));

    // Parse VTT content
    function parseVTT(vttText) {
      const lines = vttText.split("\n");
      const captions = [];
      let currentCaption = {};
      lines.forEach(line => {
        if (line.trim() === '') return;
        if (line.includes("-->")) {
          if (currentCaption.start) {
            captions.push(currentCaption);
          }
          currentCaption = {
            start: line.split(" --> ")[0],
            end: line.split(" --> ")[1],
            text: []
          };
        } else {
          currentCaption.text.push(line.trim());
        }
      });
      if (currentCaption.start) captions.push(currentCaption);
      return captions;
    }

    // Display captions based on video time
    function displayCaptions(captions) {
      const video = document.getElementById("video");
      video.ontimeupdate = () => {
        const currentTime = video.currentTime;
        if (currentCaptionIndex < captions.length && currentTime >= getTimeInSeconds(captions[currentCaptionIndex].start)) {
          lyricsElement.innerHTML = captions[currentCaptionIndex].text.join("<br>");
          currentCaptionIndex++;
        }
      };
    }

    // Convert VTT time format to seconds
    function getTimeInSeconds(timeStr) {
      const timeParts = timeStr.split(":");
      const minutes = parseInt(timeParts[0]);
      const seconds = parseFloat(timeParts[1]);
      return minutes * 60 + seconds;
    }
  </script>

</body>
</html>
