<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Videogames Drawing</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    video#webcam {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 160px;
      height: 120px;
      z-index: 2;
      border: 2px solid white;
      border-radius: 8px;
    }

    video#videoclip {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0.1;
      pointer-events: none;
    }

    #startButton {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 1rem 2rem;
      font-size: 1.2rem;
      z-index: 3;
      cursor: pointer;
      background: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <video id="webcam" autoplay muted playsinline></video>
  <video id="videoclip" src="https://files.catbox.moe/9qfgty.mp3" type="video/mp4" autoplay loop muted></video>
  <canvas id="drawCanvas"></canvas>
  <button id="startButton">Start</button>

  <script>
    const startButton = document.getElementById('startButton');
    const webcam = document.getElementById('webcam');
    const videoclip = document.getElementById('videoclip');
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');

    const audio = new Audio('https://files.catbox.moe/9qfgty.mp3');
    audio.crossOrigin = 'anonymous';

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function startExperience() {
      startButton.style.display = 'none';

      navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
        webcam.srcObject = stream;

        const audioContext = new AudioContext();
        const source = audioContext.createMediaElementSource(audio);
        const analyser = audioContext.createAnalyser();
        const micSource = audioContext.createMediaStreamSource(stream);

        micSource.connect(analyser);
        analyser.fftSize = 2048;
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        source.connect(audioContext.destination);
        audio.play();
        videoclip.play();

        function draw() {
          requestAnimationFrame(draw);
          analyser.getByteTimeDomainData(dataArray);

          const average = dataArray.reduce((a, b) => a + b) / dataArray.length;

          const radius = (average - 128) * 2;
          const x = Math.random() * canvas.width;
          const y = Math.random() * canvas.height;

          if (radius > 1) {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fill();
          }
        }

        draw();
      });
    }

    startButton.addEventListener('click', startExperience);
  </script>
</body>
</html>
